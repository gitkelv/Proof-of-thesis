name: Grade the thesis

# Runs the model on live data, commits the result and deploys the dashboard.
on:
  push:
    branches: [main]
    paths-ignore: ["site/data/**"]
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the model
        run: npm test

      - name: Check that browsers can reach each source (CORS)
        continue-on-error: true
        run: |
          O="https://gitkelv.github.io"
          for u in "https://api.llama.fi/summary/dexs/near-intents?excludeTotalDataChartBreakdown=true" \
                   "https://api.llama.fi/protocol/near-intents" \
                   "https://stablecoins.llama.fi/stablecoincharts/Near" \
                   "https://coins.llama.fi/chart/coingecko:near?span=10&period=1d"; do
            echo "$u -> $(curl -s -o /dev/null -D - -H "Origin: $O" "$u" | grep -i '^access-control-allow-origin' | tr -d '\r')"
          done
          for u in https://rpc.mainnet.near.org https://free.rpc.fastnear.com https://near.lava.build; do
            echo "$u preflight -> $(curl -s -o /dev/null -D - -X OPTIONS -H "Origin: $O" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$u" | grep -i '^access-control-allow-origin' | tr -d '\r')"
          done

      - name: Fetch live data and grade
        run: |
          for i in 1 2 3; do
            node scripts/run.mjs && exit 0
            echo "Attempt $i failed, retrying in 30s"; sleep 30
          done
          exit 1

      - name: Commit today's grade to the ledger
        run: |
          git config user.name "proof-of-thesis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "No change"; else
            git commit -m "Grade: $(node -e "console.log(require('./site/data/latest.json').verdict.label)") ($(date -u +%F))"
            git push
          fi

      - name: Build the site
        run: npm run build

      # GitHub Pages is optional: if it isn't enabled (Settings > Pages > Source:
      # GitHub Actions), the data commit above still lands and hosts like
      # Netlify or Vercel redeploy from it.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
